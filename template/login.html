<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCare Admin Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f5fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            padding: 35px;
            width: 320px;
            border-radius: 12px;
            box-shadow: 0 3px 15px #ccd6e0;
        }

        h2 {
            text-align: center;
            color: #123c69;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            box-sizing: border-box;
            border: 1px solid #ccd6e0;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #087f8c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .error {
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>SmartCare Admin</h2>

    <form action="/login" method="POST">

        <input type="text"
               name="username"
               placeholder="Enter username"
               required>

        <input type="password"
               name="password"
               placeholder="Enter password"
               required>

        <button type="submit">Login</button>

    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

</div>

</body>
</html>
